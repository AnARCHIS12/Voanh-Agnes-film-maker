<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<title>CINÉ-GENESIS · Studio de films IA</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* RESET */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f7fb;
  --p:#ffffff;
  --ink:#0b1a2b;
  --dim:#6b7c93;
  --faint:#a4b0c0;
  --ln:#d5deea;
  --a:#0a84ff;
  --a-dark:#0066cc;
  --b:#ff5a1f;
  --ok:#12b76a;
  --ok-dark:#0e9556;
  --er:#e5383b;
  --wr:#d4a017;
  --pu:#8b5fc4;
  --m:'Share Tech Mono',ui-monospace,monospace;
  --sans:Rajdhani,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --orb:'Orbitron',sans-serif;
}
html{scroll-behavior:smooth}
body{
  font:16px/1.5 var(--sans);
  color:var(--ink);
  background:var(--bg);
  min-height:100vh;
  padding-bottom:70px;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    linear-gradient(var(--ln) 1px,transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg,var(--ln) 1px,transparent 1px) 0 0/40px 40px;
  opacity:.5;
  pointer-events:none;
}
body::after{
  content:"";position:fixed;top:0;left:0;right:0;height:6px;z-index:25;
  background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 10px);
  opacity:.25;pointer-events:none;
} 

  /* HEADER */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--ink);
  padding:10px 18px;
  display:flex;flex-wrap:wrap;gap:10px 18px;
  align-items:center;justify-content:space-between;
}
.logo{
  font:800 20px var(--orb);
  letter-spacing:.1em;
  color:var(--ink);
  white-space:nowrap;
}
.logo b{color:var(--a)}
.logo i{
  display:block;
  font:10px var(--m);
  letter-spacing:.3em;
  color:var(--dim);
  font-style:normal;
  margin-top:2px;
}
#steps{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:center}
.st{
  font:11px var(--m);
  letter-spacing:.06em;
  text-transform:uppercase;
  padding:5px 9px;
  border:1px solid var(--ln);
  background:#fff;
  color:var(--dim);
  cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
}
.st:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.st.ok{color:var(--ink);border-color:var(--ink)}
.st.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.st:disabled{opacity:.45;cursor:not-allowed}
.st.on:disabled{opacity:1}
.st.audit-alert{border-color:var(--wr);color:var(--wr);background:#fff9ec}
.st.on.audit-alert{background:var(--wr);color:#fff}
.hb{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{
  font:11px var(--m);
  padding:3px 9px;
  border:1px solid var(--ok);
  color:var(--ok);
  background:#fff;
  white-space:nowrap;
}
.chip.off{border-color:var(--er);color:var(--er)}
.chip.cd{border-color:var(--b);color:var(--b);background:#fff6f0}

/* LAYOUT GÉNÉRAL */
main{
  max-width:1100px;
  margin:0 auto;
  padding:22px 16px 80px;
}
.hero,.box{
  background:var(--p);
  border:1px solid var(--ln);
  padding:22px;
  margin-bottom:16px;
  position:relative;
}
.hero::before,.hero::after,.box::before,.box::after{
  content:"";position:absolute;
  width:14px;height:14px;
  border:2px solid var(--a);
  pointer-events:none;
}
.hero::before,.box::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.hero::after,.box::after{bottom:-1px;right:-1px;border-left:0;border-top:0}

.lab{
  font:11px var(--m);
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--dim);
}
h1{font:600 32px var(--orb);letter-spacing:.03em;margin-bottom:12px}
h2{font:600 28px var(--orb);letter-spacing:.04em;margin:6px 0 8px}
h2 b{color:var(--a)}
h3{font:600 15px var(--orb);letter-spacing:.06em;margin:18px 0 6px}
h4{font:600 13px var(--orb);letter-spacing:.06em;margin:12px 0 4px;color:var(--dim)}
p.sub{color:var(--dim);margin-bottom:12px;max-width:820px;line-height:1.6}
p.sub a{color:var(--a);text-decoration:underline}
p.sub a:hover{color:var(--a-dark)}
ol,ul{margin:8px 0 12px 20px;line-height:1.8}
ol li,ul li{margin-bottom:2px}

/* GUIDES (messages contextuels) */
.guide{
  display:flex;
  gap:12px;
  align-items:flex-start;
  border:1px solid var(--a);
  background:#eef6ff;
  padding:12px 14px;
  margin:10px 0 16px;
  font-size:15px;
  line-height:1.55;
  border-radius:2px;
}
.guide > div{flex:1}
.guide.go{border-color:var(--ok);background:#effaf4}
.guide.er{border-color:var(--er);background:#fff1f1;display:block}
.guide.wt{border-color:var(--b);background:#fff6f0}
.guide.wr{border-color:var(--wr);background:#fff9ec}
.guide.pu{border-color:var(--pu);background:#f8f4ff}
.guide b{font-weight:700}
.guide code{
  font-family:var(--m);
  font-size:12px;
  background:rgba(0,0,0,.06);
  padding:1px 5px;
  border-radius:2px;
}


  /* FORMULAIRES */
textarea,input[type=text],input[type=password],input[type=number],select{
  width:100%;
  font:13px var(--m);
  padding:10px 12px;
  border:1px solid var(--ln);
  background:#f9fbfd;
  color:var(--ink);
  outline:0;
  border-radius:2px;
  transition:border-color .15s,background .15s;
  font-family:var(--m);
}
textarea:focus,input:focus,select:focus{
  border-color:var(--a);
  background:#fff;
  box-shadow:0 0 0 3px rgba(10,132,255,.08);
}
textarea{
  resize:vertical;
  min-height:70px;
  margin:4px 0;
  line-height:1.5;
  font-family:var(--sans);
  font-size:15px;
}
select{
  cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%230b1a2b' d='M0 0l5 6 5-6z'/></svg>");
  background-repeat:no-repeat;
  background-position:right 12px center;
  padding-right:32px;
}
label.f{display:block;margin:10px 0}
label.f > span.lab{display:block;margin-bottom:5px}

/* BOUTONS */
button,.btn{
  font:600 12px var(--m);
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:10px 16px;
  border:1px solid var(--ink);
  background:#fff;
  color:var(--ink);
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border-radius:2px;
  transition:all .15s;
  font-family:var(--m);
  white-space:nowrap;
}
button:hover:not(:disabled),.btn:hover:not(:disabled){
  background:var(--ink);
  color:#fff;
}
button:disabled{opacity:.35;cursor:not-allowed}
button.big,.btn.big{
  background:var(--a);
  border-color:var(--a);
  color:#fff;
  padding:14px 26px;
  font-size:14px;
  letter-spacing:.16em;
}
button.big:hover:not(:disabled){background:var(--a-dark);border-color:var(--a-dark)}
button.big.ok{background:var(--ok);border-color:var(--ok)}
button.big.ok:hover:not(:disabled){background:var(--ok-dark);border-color:var(--ok-dark)}
button.big.ghost{
  background:#fff;
  color:var(--a);
  border-color:var(--a);
}
button.big.ghost:hover:not(:disabled){background:var(--a);color:#fff}
button.sm{padding:6px 10px;font-size:10px}
button.xs{padding:4px 7px;font-size:9px}
button.danger{border-color:var(--er);color:var(--er)}
button.danger:hover:not(:disabled){background:var(--er);color:#fff}
button.pu{border-color:var(--pu);color:var(--pu)}
button.pu:hover:not(:disabled){background:var(--pu);color:#fff}
button.wide{width:100%}

/* SPLIT BUTTON */
.split{
  display:inline-flex;
  align-items:stretch;
  border:1px solid var(--pu);
  border-radius:2px;
  overflow:hidden;
  background:#fff;
  max-width:100%;
}
.split select{
  border:none;
  border-right:1px solid var(--pu);
  background:#f8f4ff;
  color:var(--pu);
  font-size:11px;
  padding:8px 26px 8px 10px;
  cursor:pointer;
  border-radius:0;
  width:auto;
  min-width:180px;
}
.split select:focus{box-shadow:none;background:#fff}
.split button{
  border:none;
  border-radius:0;
  color:var(--pu);
  background:transparent;
  padding:10px 14px;
}
.split button:hover:not(:disabled){background:var(--pu);color:#fff}

  /* FOOTER DE PAGE (Précédent / Continuer) */
.ft{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:22px;
  padding-top:16px;
  border-top:1px dashed var(--ln);
  flex-wrap:wrap;
}
.ft.center{justify-content:center}
.ft.end{justify-content:flex-end}
.ft .center{flex:1;text-align:center;font:12px var(--m);color:var(--dim);letter-spacing:.08em;text-transform:uppercase}

/* GRILLES DE CHOIX (chips genres, ratios, scènes) */
.gc{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:6px 0 10px;
}
.gc button{
  padding:7px 12px;
  font-size:11px;
  letter-spacing:.06em;
  text-transform:none;
}
.gc button.sel{background:var(--a);border-color:var(--a);color:#fff}
.gc button.sel:hover{background:var(--a-dark);border-color:var(--a-dark)}

.cat-title{
  font:700 13px var(--orb);
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--a);
  margin:20px 0 6px;
  padding-bottom:4px;
  border-bottom:1px solid var(--ln);
}
.cat-title:first-child{margin-top:6px}
.cat-desc{
  font:11px var(--m);
  color:var(--dim);
  font-style:italic;
  margin-bottom:8px;
  letter-spacing:.02em;
}

/* CHOIX (cartes cliquables oui/non) */
.choice{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:12px;
  margin:10px 0;
}
.ch{
  border:1px solid var(--ink);
  padding:16px;
  cursor:pointer;
  background:#fff;
  border-radius:2px;
  transition:all .15s;
}
.ch:hover{background:#f3f8ff;transform:translateY(-1px)}
.ch.sel{
  border-color:var(--a);
  box-shadow:inset 0 0 0 2px var(--a);
  background:#eef6ff;
}
.ch b{display:block;font:600 15px var(--orb);margin-bottom:6px;letter-spacing:.04em}
.ch p{font-size:13px;color:var(--dim);line-height:1.5;margin:0}

/* GRILLES DE CARTES */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:12px;
  margin-top:10px;
}
.grid.tight{
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:8px;
}
.grid.mini{
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:8px;
}
.cd{
  border:1px solid var(--ln);
  background:#fff;
  padding:10px;
  position:relative;
  border-radius:2px;
  transition:border-color .15s;
}
.cd:hover{border-color:var(--dim)}
.cd.pk{
  border-color:var(--a);
  box-shadow:0 0 0 1px var(--a);
  background:#f8fbff;
}
.cd .cd-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
  padding-bottom:6px;
  border-bottom:1px dashed var(--ln);
}
.cd .cd-num{
  font:700 10px var(--m);
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--a);
}
.cd .cd-tag{
  font:10px var(--m);
  padding:2px 6px;
  background:#eef6ff;
  color:var(--a);
  border-radius:2px;
  letter-spacing:.06em;
  text-transform:uppercase;
                                      }

  /* AFFICHAGE DES IMAGES — contenu entier (object-fit:contain) */
.im{
  position:relative;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  margin-bottom:8px;
  font:11px var(--m);
  color:#8899aa;
  border-radius:2px;
  min-height:80px;
}
.im img,
.im video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  display:block;
}
.im > span{
  position:relative;
  z-index:1;
  text-align:center;
  padding:8px;
  line-height:1.4;
}

/* SPINNER */
.sp,.sp2,.sp3{
  border:2px solid var(--a);
  border-top-color:transparent;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
.sp{position:absolute;width:28px;height:28px;z-index:2;border-width:3px}
.sp2{display:inline-block;width:16px;height:16px;flex:none;vertical-align:middle}
.sp3{display:inline-block;width:22px;height:22px;border-width:3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* PANNEAU CONTRÔLES IMAGE */
.ip{
  background:#f6f9fc;
  border:1px solid var(--ln);
  padding:8px;
  margin:6px 0;
  border-radius:2px;
}
.ip input[type=text]{
  font-size:12px;
  padding:7px 9px;
  margin-bottom:6px;
}
.rw{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-top:5px;
  align-items:center;
}
.up{
  border:1px solid var(--ink);
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:4px;
}

/* BARRE DE PROGRESSION */
.bar{
  height:6px;
  background:var(--ln);
  margin:12px 0;
  border-radius:3px;
  overflow:hidden;
}
.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--a),var(--pu));
  width:0;
  transition:width .4s ease;
  border-radius:3px;
}

/* FEED D'ACTIVITÉ IA */
.feed{
  margin:10px 0;
  border-top:1px dashed var(--ln);
}
.fi{
  display:flex;
  gap:10px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px dashed var(--ln);
  font-size:15px;
  line-height:1.4;
}
.fi:last-child{border-bottom:none}
.fi.ok{color:var(--ok)}
.fi.er{color:var(--er)}
.fi .ic{
  width:20px;
  text-align:center;
  flex:none;
  font-size:14px;
}
.fi em{
  margin-left:auto;
  font:11px var(--m);
  color:var(--faint);
  font-style:normal;
  white-space:nowrap;
}

/* VIGNETTES MINI */
.mg{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:8px;
  margin-top:12px;
}
.mn{
  border:1px solid var(--ln);
  background:#fff;
  padding:4px;
  border-radius:2px;
}
.mn .im{margin:0;aspect-ratio:16/9}
.mn .lab{
  font-size:9px;
  padding:4px 4px 2px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  text-align:center;
                               }

  /* STATUTS VIDÉO (dots) */
.dot{
  display:inline-block;
  width:10px;height:10px;
  border-radius:50%;
  background:var(--dim);
  margin-right:6px;
  vertical-align:middle;
}
.dot.run{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.full{background:var(--b);animation:blink 1s infinite}
.dot.paused{background:var(--dim)}
.dot.er{background:var(--er)}
@keyframes blink{50%{opacity:.25}}

/* PALIERS DE BACKOFF */
.lad{
  display:flex;
  gap:4px;
  flex-wrap:wrap;
  margin:6px 0;
}
.lad i{
  font:11px var(--m);
  font-style:normal;
  padding:3px 8px;
  border:1px solid var(--ln);
  color:var(--dim);
  background:#fff;
  border-radius:2px;
}
.lad i.past{border-color:var(--b);color:var(--b);background:#fff6f0}
.lad i.on{background:var(--b);color:#fff;border-color:var(--b)}

/* CARTE VIDÉO (tile) */
.tl{
  border:1px solid var(--ln);
  background:#fff;
  border-radius:2px;
  overflow:hidden;
  transition:border-color .3s;
}
.tl.ok{border-color:var(--ok)}
.tl.run{border-color:var(--a);background:#f8fbff}
.tl.er{border-color:var(--er);background:#fff6f6}
.tl.wait{opacity:.85}
.th{
  position:relative;
  background:#000;
  overflow:hidden;
  width:100%;
}
.th img,.th video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  display:block;
}
.tg{
  position:absolute;
  top:4px;left:4px;
  z-index:2;
  font:10px var(--m);
  background:var(--ink);
  color:#fff;
  padding:2px 6px;
  border-radius:2px;
  letter-spacing:.06em;
}
.nw{
  position:absolute;
  top:4px;right:4px;
  z-index:2;
  font:10px var(--m);
  font-style:normal;
  background:var(--b);
  color:#fff;
  padding:2px 6px;
  border-radius:2px;
  letter-spacing:.06em;
}
.tx{
  font-size:13px;
  padding:7px 9px;
  line-height:1.35;
  min-height:36px;
}
.mt{
  font:10px var(--m);
  color:var(--dim);
  padding:0 9px 8px;
  letter-spacing:.02em;
}

/* KPIs */
.kp{
  display:flex;
  gap:22px;
  flex-wrap:wrap;
  margin:12px 0;
  padding:12px;
  background:#f8fbff;
  border:1px solid var(--ln);
  border-radius:2px;
}
.kp > div{min-width:80px}
.kp b{font:600 22px var(--orb);display:block;margin-top:2px}
.kp .lab{font-size:10px}

/* CHIPS CHECKBOX */
.chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:6px 0;
}
.chip-check{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font:11px var(--m);
  padding:5px 10px;
  border:1px solid var(--ln);
  background:#fff;
  color:var(--dim);
  border-radius:2px;
  cursor:pointer;
  user-select:none;
  transition:all .15s;
}
.chip-check:hover{border-color:var(--ink);color:var(--ink)}
.chip-check.on{background:#eef6ff;border-color:var(--a);color:var(--a);font-weight:700}
.chip-check.off{opacity:.55}
.chip-check input{display:none}
.chip-check::before{
  content:"○";
  font-size:14px;
  line-height:1;
  color:currentColor;
}
.chip-check.on::before{content:"●"}

/* PILLS */
.pill-row{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:8px 0;
}
.pill{
  font:11px var(--m);
  padding:6px 12px;
  border:1px solid var(--pu);
  background:#fff;
  color:var(--pu);
  border-radius:20px;
  cursor:pointer;
  transition:all .15s;
  letter-spacing:.02em;
  user-select:none;
}
.pill:hover{background:var(--pu);color:#fff}
.pill.sel{background:var(--pu);color:#fff}

/* GROUPE PRÉ-REMPLISSAGE IA */
.prefill-group{
  background:#f8f4ff;
  border:1px solid var(--pu);
  padding:12px 14px;
  margin:12px 0;
  border-radius:2px;
}
.prefill-group > .lab{
  color:var(--pu);
  margin-bottom:8px;
  font-weight:700;
}
.prefill-group .rw{margin-top:8px}

/* ERREUR */
.err-box{
  background:#fee;
  border:1px solid var(--er);
  color:#900;
  padding:14px 16px;
  margin:10px 0;
  font:13px var(--m);
  white-space:pre-wrap;
  border-radius:2px;
  line-height:1.5;
  word-break:break-word;
}

/* CONSOLE TECHNIQUE */
#con{
  position:fixed;
  left:0;right:0;bottom:0;
  height:38vh;
  z-index:50;
  background:#0b1a2b;
  color:#bfe3ff;
  transform:translateY(100%);
  transition:transform .28s cubic-bezier(.2,.9,.3,1);
  display:flex;
  flex-direction:column;

function openDB(){
  return new Promise(function(resolve,reject){
    try{
      if(!('indexedDB' in window)){reject(new Error('IndexedDB non supporté'));return}
      var req=indexedDB.open(DB_NAME,DB_VERSION);
      req.onerror=function(){reject(req.error||new Error('IDB error'))};
      req.onsuccess=function(){resolve(req.result)};
      req.onupgradeneeded=function(e){
        var d=e.target.result;
        if(!d.objectStoreNames.contains('sessions'))d.createObjectStore('sessions',{keyPath:'id'});
        if(!d.objectStoreNames.contains('config'))d.createObjectStore('config',{keyPath:'key'});
      };
    }catch(e){reject(e)}
  });
}
function dbTx(store,mode,fn){
  return new Promise(function(resolve,reject){
    try{
      var t=db.transaction(store,mode);
      var r=fn(t.objectStore(store));
      r.onsuccess=function(){resolve(r.result)};
      r.onerror=function(){reject(r.error)};
    }catch(e){reject(e)}
  });
}
function dbFallback(err){
  if(dbMode==='idb'){
    dbMode='ls';
    log('wr','IndexedDB indisponible ('+((err&&err.message)||'?')+') → localStorage');
  }
}
function dbGet(store,key){
  if(db&&dbMode==='idb'){
    return dbTx(store,'readonly',function(o){return o.get(key)}).catch(function(e){
      dbFallback(e);
      return Promise.resolve(dbGetLS(store,key));
    });
  }
  return Promise.resolve(dbGetLS(store,key));
}
function dbGetLS(store,key){

  return Promise.resolve(dbPutLS(store,key,val));
}

  /* ═══ PLANIFICATEUR MULTI-CLÉS ═══ */
function slot(kind){
  return new Promise(function(resolve,reject){
    function attempt(){
      if(TASK&&TASK.stop){reject(new Error('stop'));return}
      var live=[];
      for(var i=0;i<KEYS.list.length;i++){
        if(!KEYS.list[i].off)live.push(KEYS.list[i]);
      }
      if(!live.length){
        reject(new Error('Aucune clé API active'));
        return;
      }
      var interval=60000/RPM[KEYS.plan][kind]*1.15*F;
      var t=now();
      var best=null,bt=Infinity;
      for(var j=0;j<live.length;j++){
        var o=live[j];
        var ready=Math.max(o[kind]||0,o.cool||0,t);
        if(ready<bt){bt=ready;best=o}
      }
      if(!best){reject(new Error('aucune clé dispo'));return}
      if(bt>t){setTimeout(attempt,Math.min(bt-t,500));return}
      if(best.cool>now()){setTimeout(attempt,300);return}
      best[kind]=t+interval;
      resolve(best);
    }
    attempt();
  });
}
function call(kind,url,body,tries){
  var attempt=0;
  function once(){
    if(attempt>=tries){
      return Promise.reject(new Error('échec après '+tries+' essais'));
    }
    attempt++;
    return slot(kind).then(function(o){
      return fetch(url,{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':'Bearer '+o.k
        },
        body:JSON.stringify(body)
      }).then(function(r){
        if(r.ok){
          o.bad=0;
          F=Math.max(1,F*0.97);
          return r;
        }
        return r.text().then(function(t){
          var snippet=t.slice(0,200);
          log('er',kind+' HTTP '+r.status+' '+snippet);
          if(r.status===429){
            var ra=parseInt(r.headers.get('Retry-After')||'25',10);
            o.cool=now()+ra*1000;
            F=Math.min(4,F*1.5);
            return sleep(500).then(once);
          }
          if(r.status===401||r.status===402||r.status===403){
            o.bad=(o.bad||0)+1;
            if(o.bad>=2){
              o.off=true;
              log('wr','clé …'+o.k.slice(-4)+' désactivée');
            }
            return sleep(800).then(once);
          }
          if(r.status>=500||r.status===408){
            return sleep(1500*Math.pow(2,attempt-1)).then(once);
          }
          return Promise.reject(new Error('HTTP '+r.status+' '+snippet));
        });
      }).catch(function(e){
        if(e&&e.message&&e.message.indexOf('HTTP 4')===0){
          return Promise.reject(e);
        }
        return sleep(1200*attempt).then(once);
      });
    });
  }
  return once();
}
function pollFetch(url,apiKey){
  return fetch(url,{headers:{Authorization:'Bearer '+apiKey}});
}

/* ═══ PARSER JSON — 5 STRATÉGIES ═══ */
function parseJ(txt){
  if(!txt)return null;
  var c=String(txt).replace(/```json/g,'').replace(/```/g,'');
  var a=c.indexOf('{'),b=c.lastIndexOf('}');
  if(a<0||b<0)return null;
  c=c.slice(a,b+1);
  try{return JSON.parse(c)}catch(e){}
  var out='',inStr=false,es=false;
  for(var i=0;i<c.length;i++){
    var ch=c[i];
    if(es){out+=ch;es=false;continue}
    if(ch==='\\'){out+=ch;es=true;continue}
    if(ch==='"'){inStr=!inStr;out+=ch;continue}
    if(inStr){
      if(ch==='\n'){out+='\\n';continue}
      if(ch==='\r'){continue}
      if(ch.charCodeAt(0)<32){out+=' ';continue}
    }
    out+=ch;
  }
  out=out.replace(/,\s*([}\]])/g,'$1');
  try{return JSON.parse(out)}catch(e){}
  try{
    var ob=0,ok=0,inS=false,esc2=false;
    for(var j=0;j<out.length;j++){
      var ch2=out[j];
      if(esc2){esc2=false;continue}
      if(ch2==='\\'){esc2=true;continue}
      if(ch2==='"'){inS=!inS;continue}
      if(inS)continue;
      if(ch2==='{')ob++;else if(ch2==='}')ob--;
      else if(ch2==='[')ok++;else if(ch2===']')ok--;
    }
    var fixed=out;
    while(ok>0){fixed+=']';ok--}
    while(ob>0){fixed+='}';ob--}
    return JSON.parse(fixed);
  }catch(e){}
  try{
    var m=out.match(/"(title|final|base|logline|summary)"\s*:\s*"((?:[^"\\]|\\.)*)"/);
    if(m){
      var obj={};
      obj[m[1]]=m[2].replace(/\\"/g,'"').replace(/\\n/g,' ');
      return obj;
    }
  }catch(e){}
  return null;
}

/* ═══ IMAGES — conversion asynchrone non bloquante + palette ═══ */
function toData(u){
  return new Promise(function(resolve){
    if(!u)return resolve(null);
    if(u.indexOf('data:')===0)return resolve(u);
    fetch(u).then(function(r){return r.blob()}).then(function(b){
      var o=URL.createObjectURL(b);
      var im=new Image();
      im.onload=function(){
        try{
          var s=Math.min(1,REF_MAX_SIDE/Math.max(im.width,im.height));
          var c=document.createElement('canvas');
          c.width=Math.round(im.width*s);
          c.height=Math.round(im.height*s);
          c.getContext('2d').drawImage(im,0,0,c.width,c.height);
          URL.revokeObjectURL(o);
          resolve(c.toDataURL('image/jpeg',0.86));
        }catch(e){URL.revokeObjectURL(o);resolve(null)}
      };
      im.onerror=function(){URL.revokeObjectURL(o);resolve(null)};
      im.src=o;
    }).catch(function(){resolve(null)});
  });
}
function mkImg(prompt,refUris,ratio){
  var body={
    model:IMG,
    prompt:san(prompt),
    n:1,
    size:'1K',
    ratio:ratio||(P?P.ratio:'16:9'),
    extra_body:{response_format:'url'}
  };
  if(refUris&&refUris.length)body.extra_body.image=refUris.filter(Boolean).slice(0,4);
  return call('img',API+'/images/generations',body,3).then(function(r){
    return r.json();
  }).then(function(d){
    var it=d.data&&d.data[0];
    var u=it&&(it.url||(it.b64_json&&'data:image/png;base64,'+it.b64_json));
    if(!u)throw new Error('pas d\'image reçue');
    var img={u:u,d:u.indexOf('data:')===0?u:null};
    if(!img.d){
      img._conv=toData(u).then(function(dd){img.d=dd||u;return img.d}).catch(function(){img.d=u;return img.d});
    }
    return img;
  });
}
function ensureRef(img){
  if(!img)return Promise.resolve(null);
  if(img.d)return Promise.resolve(img.d);
  if(img._conv)return img._conv;
  img._conv=toData(img.u).then(function(dd){img.d=dd||img.u;return img.d}).catch(function(){img.d=img.u;return img.d});
  return img._conv;
}
function extractPalette(img){
  return new Promise(function(resolve){
    ensureRef(img).then(function(data){
      if(!data)return resolve(null);
      var im=new Image();
      im.onload=function(){
        try{
          var S=48;
          var c=document.createElement('canvas');
          c.width=S;c.height=S;
          var ctx=c.getContext('2d');
          ctx.drawImage(im,0,0,S,S);
          var d=ctx.getImageData(0,0,S,S).data;
          var buckets={};
          for(var i=0;i<d.length;i+=4){
            var r=d[i],g=d[i+1],b=d[i+2];
            var key=(r>>5)+'_'+(g>>5)+'_'+(b>>5);
            if(!buckets[key])buckets[key]={r:0,g:0,b:0,n:0};
            buckets[key].r+=r;buckets[key].g+=g;buckets[key].b+=b;buckets[key].n++;
          }
          var arr=[];
          for(var k in buckets)arr.push(buckets[k]);
          arr.sort(function(a,b){return b.n-a.n});
          var pal=arr.slice(0,6).map(function(bk){
            var r2=Math.round(bk.r/bk.n);
            var g2=Math.round(bk.g/bk.n);
            var b2=Math.round(bk.b/bk.n);
            return '#'+[r2,g2,b2].map(function(x){
              var h=x.toString(16);
              return h.length<2?'0'+h:h;
            }).join('');
          });
          resolve(pal.join(', '));
        }catch(e){resolve(null)}
      };
      im.onerror=function(){resolve(null)};
      im.src=data;
    });
  });
}
function readFile(f,maxSide){
  return new Promise(function(resolve){
    var fr=new FileReader();
    fr.onload=function(){
      var im=new Image();
      im.onload=function(){
        try{
          var s=Math.min(1,maxSide/Math.max(im.width,im.height));
          var c=document.createElement('canvas');
          c.width=Math.round(im.width*s);
          c.height=Math.round(im.height*s);
          c.getContext('2d').drawImage(im,0,0,c.width,c.height);
          var d=c.toDataURL('image/jpeg',0.88);
          resolve({u:d,d:d});
        }catch(e){resolve(null)}
      };
      im.onerror=function(){resolve(null)};
      im.src=fr.result;
    };
    fr.readAsDataURL(f);
  });
                        }

  if(id==='P')return{t:'p',o:P};
  for(var i=0;i<P.chars.length;i++){
    if(P.chars[i].id===id)return{t:'c',o:P.chars[i]};
  }
  for(var j=0;j<P.scenes.length;j++){
    var s=P.scenes[j];
    if(s.id===id)return{t:'s',o:s};
    var sh=s.shots||[];
    for(var k=0;k<sh.length;k++){
      if(sh[k].id===id)return{t:'h',o:sh[k],s:s};
    }
  }
  return null;
}
function charById(id){
  if(!P)return null;
  for(var i=0;i<P.chars.length;i++)if(P.chars[i].id===id)return P.chars[i];
  return null;
}
function charByName(name){

function charsSheet(ids){

  }
  return arr.join('; ');
}
function charImgs(ids){
  if(!ids||!ids.length)return [];

  /* ═══ PROMPTS CONTEXTUELS ═══ */
function promptFor(f){
  var o=f.o;
  if(f.t==='c'){
    return {
      p:'Full-body character reference, plain neutral background, '+styleOf()+'. '+
        (o.name||'')+': '+(o.desc||'')+'. '+
        (o.outfit?'Wearing: '+o.outfit+'.':'')+
        ' No text, no watermark. Consistent design across all frames.',
      refs:[],
      ratio:'9:16'
    };
  }
  if(f.t==='s'){
    var sh=charsSheet(o.chars);
    var pal=o.palette?(' Reuse this palette across this scene: '+o.palette+'.'):'';
    var extras=(o.extras&&o.extras.length)?
      ' Background figures (minor): '+o.extras.join(', ')+'.':'';
    return {
      p:'Cinematic establishing frame, wide shot. '+styleOf()+'. '+
        'Setting: '+(o.decor||'')+'. Mood: '+(o.mood||'')+'.'+
        (sh?' Characters EXACTLY these, no others: '+sh+'.':'')+
        extras+pal+
        ' No text, no watermark.',
      refs:charImgs(o.chars)
    };
  }
  var sh2=charsSheet(o.chars);
  var pal2=f.s.palette?(' Match this palette exactly: '+f.s.palette+'.'):'';
  var extras2=(f.s.extras&&f.s.extras.length)?
    ' Background figures (minor): '+f.s.extras.join(', ')+'.':'';
  var shotsArr=f.s.shots||[];
  var isFirst=(shotsArr.length&&shotsArr[0]===o);
  var wideRule=isFirst?' Wide establishing shot to open the scene.':'';
  var charsRule=sh2?
    (' Characters EXACTLY these, no others, all visible: '+sh2+'.'):
    ' No characters visible.';
  var arr=shotsArr;
  var idx=arr.indexOf(o);
  var contCtx='';
  if(idx>0){
    var prev=arr[idx-1];
    contCtx+=' Previous shot ended with: '+(prev.end_state||prev.action||'')+'.';
  }
  if(idx>=0&&idx<arr.length-1){
    var nxt=arr[idx+1];
    contCtx+=' Next shot will start with: '+(nxt.action||'')+'.';
  }
  return {
    p:'Cinematic film still, '+(o.size||'medium')+' shot.'+wideRule+' '+
      styleOf()+'. Setting: '+(f.s.decor||'')+'. '+
      'Mood: '+(f.s.mood||'')+'. Action: '+(o.action||'')+'. '+
      'Camera: '+(o.camera||'static')+'.'+
      charsRule+extras2+pal2+contCtx+
      ' No text, no watermark.',
    refs:charImgs(o.chars).concat(f.s.img?[f.s.img]:[]).filter(Boolean)
  };
}

/* ═══ GÉNÉRATION D'IMAGE ═══ */
function gen(id,opt){
  opt=opt||{};
  var f=find(id);
  if(!f||f.o.busy)return Promise.resolve();
  var o=f.o;
  o.busy=true;
  o.err='';
  refresh(id);
  return (function(){
    var q=promptFor(f);
    var p=q.p;
    var refObjs=q.refs.filter(Boolean);
    if(opt.edit&&o.img){
      refObjs=[o.img].concat(refObjs);
      p+=' Edit the first reference image: '+opt.extra+
         '. Keep everything else identical.';
    } else if(opt.extra){
      p+=' '+opt.extra+'.';
    }
    var chain=Promise.resolve([]);
    for(var i=0;i<refObjs.length;i++){
      (function(r){
        chain=chain.then(function(arr){
          return ensureRef(r).then(function(uri){
            if(uri)arr.push(uri);
            return arr;
          });
        });
      })(refObjs[i]);
    }
    return chain.then(function(refUris){
      return mkImg(p,refUris,q.ratio||f.ratio||(P?P.ratio:'16:9'));
    });
  })().then(function(img){
    o.img=img;
    if(f.t==='s'){
      return extractPalette(o.img).then(function(pal){
        if(pal){
          o.palette=pal;
          (o.shots||[]).forEach(function(h){if(!h.img)h.palette=pal});
        }
      });
    }
  }).catch(function(e){
    if(!e||e.message!=='stop'){
      o.err='Échec : '+trunc((e&&e.message)||'?',80);
      log('er','image : '+((e&&e.message)||'?'));
    }
  }).then(function(){
    o.busy=false;
    refresh(id);
    save();
  });
}
function imgPass(list,label){
  var todo=list.filter(function(o){return !o.img});
  if(!todo.length)return Promise.resolve();
  setTiles(list);
  var it=fd('Création des '+label+' (0/'+todo.length+')');
  setPg(0,todo.length);
  var n=0;
  var promises=todo.map(function(o){
    return gen(o.id).then(function(){
      n++;
      setPg(n,todo.length);
      it.t='Création des '+label+' ('+n+'/'+todo.length+')';
      paintFeed();
    });
  });
  return Promise.all(promises).then(function(){
    chk();
    var miss=list.filter(function(o){return !o.img});
    if(!miss.length){
      fdDone(it,list.filter(function(o){return o.img}).length+'/'+list.length+' '+label+' prêt(e)s');
      return;
    }
    it.t='Nouvel essai pour '+miss.length+' image(s)…';
    paintFeed();
    return Promise.all(miss.map(function(o){return gen(o.id)})).then(function(){
      chk();
      var still=miss.filter(function(o){return !o.img});
      if(still.length){
        it.t='Certaines images ont échoué ('+still.length+'/tout). Relancez-les manuellement.';
        it.s='er';
        paintFeed();
      } else {
        fdDone(it,list.filter(function(o){return o.img}).length+'/'+list.length+' '+label+' prêt(e)s');
      }
    });
  });
}

function refresh(id){
  var f=find(id);
  if(!f)return;
  function replace(prefix,html){
    var el=document.getElementById(prefix+id);
    if(!el||!html)return;
    var tmp=document.createElement('div');
    tmp.innerHTML=html;
    if(tmp.firstChild)el.parentNode.replaceChild(tmp.firstChild,el);
  }
  if(f.t==='c'){
    replace('c-',charCard(f.o));
    replace('i-',charIn(f.o));
  } else if(f.t==='s'){
    replace('c-',sceneCard(f.o,P.scenes.indexOf(f.o)));
  } else if(f.t==='h'){
    replace('c-',shotCard(f.o));
    var all=shots(),idx=-1;
    for(var i=0;i<all.length;i++)if(all[i].h===f.o){idx=i;break}
    if(idx>=0)replace('t-',tile(f.o,idx+1));
  }
  if(TASK)replace('m-',mini(f.o));
  syncNext();
  if(PAGE_ORDER[page]==='prod')stats();
            }

function task(step,title,fn,after){
  if(TASK)return;
  TASK={step:step,title:title,fn:fn,after:after,items:[],start:now(),stop:false,err:null,pg:null,tiles:null};
  page=step;
  render();
  return Promise.resolve().then(fn).then(function(){
    chk();
  }).then(function(){
    var T=TASK;
    TASK=null;
    if(T&&T.after)T.after();
  }).catch(function(e){
    var T=TASK;
    if(!T)return;
    if(e&&e.message==='stop'){
      TASK=null;
      toast('Arrêté');
      render();
      return;
    }
    T.items.forEach(function(i){if(i.s==='run')i.s='er'});
    T.err=(e&&e.message)||'Erreur inconnue';
    log('er',title+' : '+T.err);
    render();
    paintFeed();
  });
}
function retryTask(){
  var T=TASK;
  if(!T||!T.err)return;
  TASK=null;
  task(T.step,T.title,T.fn,T.after);
}

/* ═══ NAVIGATION + RENDER ═══ */
function go(p){
  if(TASK)return;
  if(page>0&&P)P.last=page;
  var n;
  if(typeof p==='number')n=p;
  else n=PAGE_ORDER.indexOf(p);
  if(n<0||n>=PAGE_ORDER.length)n=0;
  page=n;
  render();
  onEnter();
}
function done(stepKey,sub){
  if(P)P.sub[stepKey]=sub;
  save();
  render();
}
function onEnter(){
  if(TASK||!P)return;
  var key=PAGE_ORDER[page];
  if(!key)return;
  var s=P.sub[key]||(key==='script'?'in':'cfg');
  if(s!=='cfg')return;
  if(key==='chars')runChars(P.chars.length?'own':'ai');
  else if(key==='scenes')runScenes(P.nsc||5);
  else if(key==='shots')runShots();
  else if(key==='audit')runAudit();
}
function renderSteps(){
  if(!P)return;
  var cur=page;
  var max=Math.max(P.max||0,cur);
  var hasCrit=P.audit&&P.audit.issues&&P.audit.issues.some(function(i){
    return i.severity==='critique'&&!i.resolved&&!i.ignored;
  });
  var stepsEl=$('#steps');
  if(!stepsEl)return;
  stepsEl.innerHTML=STEPS.map(function(s,i){
    var can=!TASK&&i!==cur&&(i===0||(KEYS.list.length&&i<=max));
    var cls='st '+(i===cur?'on':can?'ok':'')+((i===6&&hasCrit)?' audit-alert':'');
    return '<button class="'+cls+'" '+(can?'data-a="go" data-n="'+i+'"':'disabled')+'>'+(i+1)+'. '+s+'</button>';
  }).join('');
}
function view(){
  try{
    if(TASK)return workView();
    var key=PAGE_ORDER[page];
    if(!key)key='keys';
    var sub=P.sub[key]||(key==='script'?'in':'cfg');
    var v=V[key]||{};
    var fn=v[sub]||v.cfg||v.in;
    if(typeof fn!=='function'){
      return '<div class="hero">'+hd(page+1,'Étape '+key)+'<p class="sub">Pas d\'affichage pour cette section.</p></div>';
    }
    return fn();

  /* ═══ AUDIT LOCAL (algorithmique) ═══ */
function auditLocal(){
  var issues=[];
  P.scenes.forEach(function(s,si){
    var sh=s.shots||[];
    if(sh.length&&sh[0].size!=='wide'){
      issues.push({
        id:rid(),severity:'mineur',
        location:'Scène '+(si+1)+', plan 1',
        problem:'Le premier plan n\'est pas un plan d\'établissement (wide).',
        suggestion:'Passer le premier plan en "wide" pour poser le lieu.',
        field:'size',
        apply:{target:'shot',shotId:sh[0].id,field:'size',value:'wide'}
      });
    }
    for(var i=1;i<sh.length;i++){
      if(sh[i].size===sh[i-1].size){
        issues.push({
          id:rid(),severity:'mineur',
          location:'Scène '+(si+1)+', plans '+i+'-'+(i+1),
          problem:'Deux plans consécutifs du même type ('+sh[i].size+').',
          suggestion:'Varier en passant l\'un des deux en "medium" ou "close-up".',
          field:'size',
          apply:{target:'shot',shotId:sh[i].id,field:'size',value:sh[i].size==='wide'?'medium':'close-up'}
        });
      }
    }
    sh.forEach(function(h,hi){
      var d=speechDur(h.line);
      var shotDur=h.duration||5;
      if(d>shotDur+1.5){
        issues.push({
          id:rid(),severity:'majeur',
          location:'Scène '+(si+1)+', plan '+(hi+1),
          problem:'La réplique dure environ '+d.toFixed(1)+' s pour un plan de '+shotDur+' s.',
          suggestion:'Allonger le plan pour que la réplique rentre.',
          field:'duration',
          apply:{target:'shot',shotId:h.id,field:'duration',value:Math.ceil(d+1)}
        });
      }
    });
    sh.forEach(function(h,hi){
      var t=String(h.line||'').trim();
      if(t&&t.split(/\s+/).length<4){
        issues.push({
          id:rid(),severity:'mineur',
          location:'Scène '+(si+1)+', plan '+(hi+1),
          problem:'Réplique très courte : "'+t+'"',
          suggestion:'Enrichir avec du sous-texte (au moins 8 mots).',
          field:'line',apply:null
        });
      }
    });
    var hasLine=sh.some(function(h){return h.line&&h.line.trim()});
    if(!hasLine&&sh.length){
      issues.push({
        id:rid(),severity:'mineur',
        location:'Scène '+(si+1),
        problem:'Aucune réplique dans cette scène.',
        suggestion:'Ajouter au moins une réplique pour donner du rythme.',
        field:'line',apply:null
      });
    }
    (s.chars||[]).forEach(function(cid){
      if(!charById(cid)){
        issues.push({
          id:rid(),severity:'critique',
          location:'Scène '+(si+1),
          problem:'Personnage référencé introuvable (id orphelin).',
          suggestion:'Retirer ce personnage ou créer sa fiche.',
          field:'chars',apply:null
        });
      }
    });
    if(sh.length>=3&&(s.chars||[]).length===1){
      var totalDur=sh.reduce(function(a,h){return a+(h.duration||5)},0);
      if(totalDur>20){
        issues.push({
          id:rid(),severity:'mineur',
          location:'Scène '+(si+1),
          problem:'Scène longue ('+totalDur+' s) avec un seul personnage.',
          suggestion:'Ajouter un second personnage pour varier.',
          field:'chars',apply:null
        });
      }
    }
  });
  for(var k=1;k<P.scenes.length;k++){
    if(P.scenes[k].decor===P.scenes[k-1].decor&&P.scenes[k].decor){
      issues.push({
        id:rid(),severity:'mineur',
        location:'Scènes '+k+'-'+(k+1),
        problem:'Deux scènes consécutives ont le même décor.',
        suggestion:'Varier le lieu.',
        field:'decor',apply:null
      });
    }
  }
  return issues;
}

function runAuditPipeline(){
  var local=auditLocal();
  return auditAI().catch(function(e){
    log('wr','audit IA : '+e.message);
    return [];
  }).then(function(ai){
    var all=local.slice();
    ai.forEach(function(it){
      var m=String(it.location||'').match(/scène\s*(\d+)(?:\s*plan\s*(\d+))?/i);
      var sceneId=null,shotId=null;
      if(m){
        var si=parseInt(m[1],10)-1;
        if(P.scenes[si]){
          sceneId=P.scenes[si].id;
          if(m[2]){
            var hi=parseInt(m[2],10)-1;
            var h=(P.scenes[si].shots||[])[hi];
            if(h)shotId=h.id;
          }
        }
      }
      all.push({
        id:rid(),
        severity:it.severity||'mineur',
        location:it.location||'—',
        problem:it.problem||'',
        suggestion:it.suggestion||'',
        field:it.field||(it.apply&&it.apply.field)||'',
        apply:(it.apply&&sceneId)?{
          target:shotId?'shot':'scene',
          sceneId:sceneId,shotId:shotId,
          field:it.apply.field,
          value:it.apply.value
        }:null
      });
    });
    return all;
  });
            }


  /* ═══ APPLICATION DES REMARQUES D'AUDIT ═══ */
function applyIssue(issueId){
  if(!P.audit)return;
  var it=null;
  for(var i=0;i<P.audit.issues.length;i++)if(P.audit.issues[i].id===issueId)it=P.audit.issues[i];
  if(!it)return;
  if(!it.apply){
    it.resolved=true;
    toast('Remarque acceptée. Modifiez le champ manuellement.');
    save();render();
    return;
  }
  var a=it.apply;
  if(a.target==='shot'&&a.shotId){
    for(var si=0;si<P.scenes.length;si++){
      var sh=P.scenes[si].shots||[];
      for(var j=0;j<sh.length;j++){
        if(sh[j].id===a.shotId){
          sh[j][a.field]=a.value;
          if(['action','camera','size','chars','line'].indexOf(a.field)>=0){
            sh[j].img=null;sh[j].video=null;sh[j].vst='wait';
          }
          break;
        }
      }
    }
  } else if(a.target==='scene'&&a.sceneId){
    for(var k=0;k<P.scenes.length;k++){
      if(P.scenes[k].id===a.sceneId){
        P.scenes[k][a.field]=a.value;
        if(['decor','mood','chars','summary'].indexOf(a.field)>=0){
          P.scenes[k].img=null;
          (P.scenes[k].shots||[]).forEach(function(h){
            h.img=null;h.video=null;h.vst='wait';
          });
        }
        break;
      }
    }
  }
  it.resolved=true;
  toast('✓ Correction appliquée');
  save();render();
}
function ignoreIssue(issueId){
  if(!P.audit)return;
  for(var i=0;i<P.audit.issues.length;i++){
    if(P.audit.issues[i].id===issueId){
      P.audit.issues[i].ignored=true;
      break;
    }
  }
  save();render();
}
function applyAllIssues(){
  if(!P.audit)return;
  var n=0;
  var snapshot=P.audit.issues.slice();
  snapshot.forEach(function(it){
    if(!it.resolved&&!it.ignored&&it.apply){
      applyIssue(it.id);n++;
    }
  });
  toast('✓ '+n+' correction(s) appliquée(s)');
}

function launch(h,s){
  return slot('vid').then(function(keyObj){
    var free=KEYS.plan==='free';
    var fr=h.img&&h.img.u&&h.img.u.indexOf('data:')!==0?h.img.u:imgRef(h.img);
    var D=dims();
    var body;
    if(free){
      body={model:VID.free,prompt:vpFor(h,s),num_frames:97,frame_rate:12,width:D[0],height:D[1],image:fr};
    } else {
      body={model:VID.plan,prompt:vpFor(h,s),seconds:String(h.duration||10),mode:'keyframe',size:'720P',aspect_ratio:P.ratio,first_frame:fr};
    }
    h.vst='run';h.msg='envoi…';h.err='';
    refresh(h.id);
    return fetch(API+'/videos',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+keyObj.k},
      body:JSON.stringify(body)
    }).then(function(r){
      if(r.status===503){
        return r.text().catch(function(){return ''}).then(function(t){
          log('wr','503 '+t.slice(0,120));
          h.vst='wait';refresh(h.id);
          sat();
        });
      }
      if(r.status===429){
        keyObj.cool=now()+(parseInt(r.headers.get('Retry-After')||'30',10))*1000;
        h.vst='wait';refresh(h.id);
        return;
      }
      if(!r.ok){
        return r.text().catch(function(){return ''}).then(function(t){
          t=t.slice(0,140);
          if([401,402,403].indexOf(r.status)>=0){
            keyObj.bad=(keyObj.bad||0)+1;
            if(keyObj.bad>=2){
              keyObj.off=true;
              if(!KEYS.list.some(function(k){return !k.off})){
                Q.on=false;Q.st='paused';

              }
            }
          }
          h.vst='er';h.err='HTTP '+r.status+' '+t;
          log('er','vidéo '+h.err);
          refresh(h.id);
        });
      }
      return r.json().then(function(d){
        var id=d.video_id||d.id||d.task_id||(d.data&&(d.data.video_id||d.data.id));
        if(!id){
          h.vst='er';h.err='pas de video_id';
          refresh(h.id);return;
        }
        var inner=null;
        try{
          if(id.indexOf('video_')===0){
            var b=id.slice(6);
            while(b.length%4)b+='=';
            var m=atob(b).match(/video_id:([^;]+)/);
            if(m)inner=m[1].trim();
          }
        }catch(e){}
        h.task={id:id,inner:inner,k:keyObj.k};
        Q.st='run';Q.step=0;
        log('ok','vidéo envoyée (clé …'+keyObj.k.slice(-4)+')');
        save();qui();
        poll(h);
      });
    }).catch(function(e){
      h.vst='wait';
      Q.next=now()+30000;
      log('wr','réseau : '+e.message);
      refresh(h.id);
    });
  });
}

  function poll(h){
  var t=h.task;
  var model=VID[KEYS.plan];
  var end=now()+VIDEO_TIMEOUT_MS;
  var n=0,miss=0;
  var apiKey=t.k;
  return sleep(KEYS.plan==='free'?30000:8000).then(function(){
    function step(){
      if(now()>end||!P||h.vst!=='run'){
        if(now()>end){h.vst='er';h.err='délai dépassé';save();refresh(h.id)}
        return Promise.resolve();
      }
      var ids=[t.id];
      if(t.inner&&t.inner!==t.id)ids.push(t.inner);
      var iv=POLL_INTERVALS[Math.min(n,POLL_INTERVALS.length-1)]*1000;
      n++;
      var found=null;
      function tryOne(i){
        if(i>=ids.length){
          if(found)return afterPoll(found);
          miss++;
          if(miss>20){
            h.vst='er';h.err='suivi impossible';
            save();refresh(h.id);
            return Promise.resolve();
          }
          return sleep(iv).then(step);
        }
        return pollFetch(
          POLL+'?video_id='+encodeURIComponent(ids[i])+'&model_name='+encodeURIComponent(model),
          apiKey
        ).then(function(r){
          if(r.status===429){
            return sleep(8000).then(function(){return tryOne(i)});
          }
          if(!r.ok){miss++;return tryOne(i+1)}
          return r.json().then(function(dd){found=dd;return afterPoll(dd)});
        }).catch(function(){miss++;return tryOne(i+1)});
      }
      function afterPoll(dd){
        var s=String(dd.status||dd.state||'').toLowerCase();
        h.msg=dd.progress?dd.progress+'%':s;
        refresh(h.id);
        if(['completed','succeeded','done','success','finished','ready'].indexOf(s)>=0){
          var u=(dd.metadata&&(dd.metadata.url||dd.metadata.video_url))||
                (dd.output&&(dd.output.url||dd.output.video_url))||
                (dd.data&&(dd.data.url||dd.data.video_url))||
                dd.url||dd.video_url;
          if(!u){
            h.vst='er';h.err='pas d\'URL';
            save();refresh(h.id);
            return Promise.resolve();
          }
          h.video=u;h.vst='ok';h.seen=false;h.err='';
          log('ok','vidéo prête');
          toast('🎬 Nouvelle vidéo prête');
          save();refresh(h.id);
          return Promise.resolve();
        }
        if(['failed','error','cancelled','canceled','rejected'].indexOf(s)>=0){
          var msg=(dd.error&&dd.error.message)||dd.error||'échec';
          h.vst='er';h.err=String(msg).slice(0,100);
          log('er','vidéo : '+h.err);
          save();refresh(h.id);
          return Promise.resolve();
        }
        return sleep(iv).then(step);
      }
      return tryOne(0);
    }
    return step();
  }).catch(function(e){
    if(e.message!=='stop'){
      h.vst='er';h.err=e.message;
      log('er','vidéo : '+e.message);
      save();refresh(h.id);
    }
  });
}

function warmupTTS(){
  if(PLAYER.warmup)return;
  if(!('speechSynthesis' in window))return;
  try{
    var u=new SpeechSynthesisUtterance(' ');
    u.volume=0;
    speechSynthesis.speak(u);
    PLAYER.warmup=true;
  }catch(e){}
}
function pickVoice(){
  if(!('speechSynthesis' in window))return null;
  var vs=speechSynthesis.getVoices();
  var fr=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf('fr')===0});
  if(!fr.length)return null;
  var pref=fr.find(function(v){return /premium|enhanced|amelie|thomas|audrey|marie/i.test(v.name)});
  return pref||fr[0];
}
function speak(txt){
  return new Promise(function(resolve){
    if(!txt||!('speechSynthesis' in window))return resolve();
    try{speechSynthesis.cancel()}catch(e){}
    var u=new SpeechSynthesisUtterance(txt);
    u.lang='fr-FR';
    if(!PLAYER.voice)PLAYER.voice=pickVoice();
    if(PLAYER.voice)u.voice=PLAYER.voice;
    u.rate=1.0;
    u.pitch=1.0;
    u.onend=resolve;
    u.onerror=resolve;
    try{speechSynthesis.speak(u)}catch(e){resolve()}
  });
}
function stopSpeak(){
  try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}
}
function buildSeq(mode){
  var all=shots();
  if(mode==='video')return all.filter(function(x){return x.h.video});
  return all.filter(function(x){return x.h.img||x.h.video});
}

function closePlayer(){

function renderPlayer(){
  var cur=PLAYER.seq[PLAYER.idx];
  if(!cur)return;
  var h=cur.h,s=cur.s;
  var modeLabel=PLAYER.mode==='video'?'🎬 VIDÉO':(PLAYER.mode==='audio'?'🔊 AUDIO':'📽 DIAPORAMA');
  var info=$('#plinfo');
  if(info)info.textContent=modeLabel+' · '+(PLAYER.idx+1)+' / '+PLAYER.seq.length+' · Scène '+(P.scenes.indexOf(s)+1);
  var pg=$('#plpg');
  if(pg)pg.style.width=((PLAYER.idx+1)/PLAYER.seq.length*100)+'%';
  var line=h.line?(h.who?h.who+' : ':'')+h.line:'';
  var sub=$('#sub');
  if(sub)sub.textContent=line;
  var v=$('#pv'),im=$('#pi');
  if(PLAYER.mode==='video'&&h.video){
    im.style.display='none';
    v.style.display='block';
    if(v.src!==h.video)v.src=h.video;
  } else if(PLAYER.mode==='audio'){
    v.style.display='none';
    im.style.display='none';
  } else {
    v.style.display='none';
    im.style.display='block';
    im.src=imgRef(h.img)||h.video||'';
  }
  var tb=document.querySelector('[data-a="pltoggle"]');
  if(tb)tb.textContent=PLAYER.paused?'▶ Reprendre':'⏸ Pause';
}
function playPlayerStep(){
  if(!PLAYER.active||PLAYER.paused)return Promise.resolve();
  var cur=PLAYER.seq[PLAYER.idx];
  if(!cur){closePlayer();return Promise.resolve()}
  var h=cur.h;
  if(PLAYER.mode==='video'&&h.video){
    var v=$('#pv');
    v.currentTime=0;
    return new Promise(function(r){
      var timeout=setTimeout(r,20000);
      v.onended=function(){clearTimeout(timeout);r()};
      v.onerror=function(){clearTimeout(timeout);r()};
      v.play().catch(function(){clearTimeout(timeout);r()});
    }).then(function(){
      h.seen=true;
      if(PLAYER.timer)clearTimeout(PLAYER.timer);
      PLAYER.timer=setTimeout(function(){
        if(PLAYER.active&&!PLAYER.paused)playerNext();
      },300);
    });
  }
  var line=h.line?(h.who?h.who+' : ':'')+h.line:'';
  return speak(line).then(function(){
    var minDur=Math.max(2500,line.length*70);
    if(PLAYER.timer)clearTimeout(PLAYER.timer);
    PLAYER.timer=setTimeout(function(){
      if(PLAYER.active&&!PLAYER.paused)playerNext();
    },minDur);
  });
}

    playPlayerStep();

    closePlayer();
  }
}
function playerPrev(){

  playPlayerStep();

function playerToggle(){
  PLAYER.paused=!PLAYER.paused;

    try{v.pause()}catch(e){}
    stopSpeak();
    if(PLAYER.timer)clearTimeout(PLAYER.timer);
  } else {
    if(PLAYER.mode==='video'&&PLAYER.seq[PLAYER.idx]&&PLAYER.seq[PLAYER.idx].h.video){
      v.play().catch(function(){});

function playerChangeMode(){
  var cur=PLAYER.seq[PLAYER.idx];
  PLAYER.mode=PLAYER.mode==='video'?'diaporama':PLAYER.mode==='diaporama'?'audio':'video';
  PLAYER.seq=buildSeq(PLAYER.mode);
  if(!PLAYER.seq.length){
    toast('Pas de contenu dans ce mode');
    PLAYER.mode='video';
    PLAYER.seq=buildSeq('video');
    return;
  }
  var h=cur&&cur.h;
  if(h){
    var newIdx=-1;
    for(var i=0;i<PLAYER.seq.length;i++)if(PLAYER.seq[i].h===h){newIdx=i;break}
    PLAYER.idx=newIdx>=0?newIdx:0;
  }
  stopSpeak();

function redo(n){
  if(!confirm('Refaire cette étape avec l\'IA ? Le contenu actuel sera remplacé.'))return;
  var key=PAGE_ORDER[n];
  if(key==='chars')P.chars=[];
  if(key==='scenes')P.scenes=[];
  if(key==='shots')P.scenes.forEach(function(s){s.shots=[]});
  if(key==='audit')P.audit=null;
  P.sub[key]='cfg';
  render();
  onEnter();
}
function removeChar(id){
  var c=charById(id);
  if(!c)return;
  if(!confirm('Supprimer '+c.name+' ? Il sera retiré des scènes et plans.'))return;
  P.chars=P.chars.filter(function(x){return x.id!==id});
  P.scenes.forEach(function(s){
    s.chars=(s.chars||[]).filter(function(cid){return cid!==id});
    (s.shots||[]).forEach(function(h){
      h.chars=(h.chars||[]).filter(function(cid){return cid!==id});
    });
  });
  render(true);
}

/* ═══ ACTIONS — gestionnaire principal (partie 1) ═══ */
function onClick(e){
  var b=e.target.closest('[data-a]');
  if(!b||b.disabled)return;
  var a=b.dataset.a,id=b.dataset.id;
  if(TASK&&OK_DURING.indexOf(a)<0){
    return toast('Une opération est en cours : patientez ou cliquez sur Arrêter');
  }

  /* Navigation + console */
  if(a==='go')go(+b.dataset.n);
  else if(a==='con'){$('#con').classList.toggle('on')}
  else if(a==='conclear'){$('#lb').innerHTML='';toast('Journal effacé')}
  else if(a==='concopy'){
    var txt=$('#lb').innerText||'';
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast('Journal copié')}).catch(function(){toast('Copie impossible')});
    } else {toast('Copie non supportée')}
  }
  else if(a==='closemd'){$('#md').classList.remove('on')}

  /* Clés API */
  else if(a==='savekeys'){
    var raw=$('#keys').value;
    var ks=raw.split(/[\s,;]+/).map(function(s){return s.trim()}).filter(function(s){return s.length>=8});
    var uniq=[];
    ks.forEach(function(k){if(uniq.indexOf(k)<0)uniq.push(k)});
    if(!uniq.length)return toast('Collez au moins une clé API');
    KEYS.plan=$('#plan').value;
    KEYS.list=uniq.map(function(k){
      var old=null;
      for(var j=0;j<KEYS.list.length;j++)if(KEYS.list[j].k===k){old=KEYS.list[j];break}
      return old||mkKey(k);
    });
    dbPut('config',{key:'keys',list:uniq,plan:KEYS.plan}).catch(function(er){log('wr','clés : '+er.message)});
    toast('✓ '+uniq.length+' clé(s) enregistrée(s)');
    go(Math.max(1,P.last||1));
  }

  /* Genre + format */
  else if(a==='genre'){
    P.genre={name:b.dataset.n,style:b.dataset.s};
    save();render(true);syncNext();
  }
  else if(a==='ratio'){
    P.ratio=b.dataset.n;
    save();render(true);
  }

  /* Synopsis */
  else if(a==='synai'){
    if((P.synRaw||'').trim().length<10)return toast('Écrivez au moins une phrase');
    runSyn();
  }
  else if(a==='synasis'){
    if((P.synRaw||'').trim().length<10)return toast('Écrivez au moins une phrase');
    P.final=P.synRaw;
    P.syn=null;
    done('script','fin');
  }
  else if(a==='synedit'){
    P.syn=null;P.final='';
    P.sub.script='in';
    render();
  }
  else if(a==='synback'){
    P.sub.script=P.syn?'pick':'in';
    render();
  }
  else if(a==='synok'){
    if((P.syn.sel||[]).length)runMerge();
    else{
      P.final=P.syn.base;
      P.sub.script='fin';
      render();
    }
  }
  else if(a==='synmore')runMoreSuggestions();
                                              

    /* Personnages */
  else if(a==='chai')runChars('ai');
  else if(a==='chown')runChars('own');
  else if(a==='addchar'){
    P.chars.push({id:rid(),name:'Nouveau personnage',role:'',desc:'',outfit:'',img:null,busy:false});
    render(true);
    window.scrollTo(0,document.body.scrollHeight);
  }
  else if(a==='prefill-char'){
    var sel=$('#char-prefill-type');
    if(!sel)return;
    var type=PREFILL_CHAR_TYPES[+sel.value];
    task(page,'Création assistée du personnage',function(){
      var it=fd('L\'IA imagine : '+type+'…');
      return aiAddOneChar(type).then(function(){
        chk();
        fdDone(it,'Personnage créé : '+(P.chars[P.chars.length-1]||{}).name);
      }).then(function(){
        var c=P.chars[P.chars.length-1];
        var it2=fd('Génération du portrait…');
        return gen(c.id).then(function(){fdDone(it2,'Portrait prêt')});
      });
    },function(){render()});
  }
  else if(a==='prefill-char-custom'){
    var el=$('#char-prefill-custom');
    var prompt=el&&el.value.trim();
    if(!prompt)return toast('Décrivez le personnage ou choisissez un type');
    task(page,'Création assistée du personnage',function(){
      var it=fd('L\'IA imagine : '+prompt+'…');
      return aiAddOneChar(prompt).then(function(){
        chk();
        fdDone(it,'Personnage créé');
      }).then(function(){
        var c=P.chars[P.chars.length-1];
        var it2=fd('Génération du portrait…');
        return gen(c.id).then(function(){fdDone(it2,'Portrait prêt')});
      });
    },function(){render()});
  }

  /* Scènes */
  else if(a==='nsc'){P.nsc=+b.dataset.n;save();render(true)}
  else if(a==='scgo'){
    if(P.scenes.length&&!confirm('Remplacer les scènes existantes ?'))return;
    runScenes(P.nsc||5);
  }
  else if(a==='prefill-scene'){
    var sel2=$('#scene-prefill-type');
    if(!sel2)return;
    var type2=PREFILL_SCENE_TYPES[+sel2.value];
    task(page,'Ajout d\'une scène',function(){
      var it=fd('L\'IA écrit une scène : '+type2+'…');
      return aiAddOneScene(type2).then(function(){
        chk();
        fdDone(it,'Scène ajoutée');
      }).then(function(){
        var s=P.scenes[P.scenes.length-1];
        var it2=fd('Génération de l\'image de scène…');
        return gen(s.id).then(function(){fdDone(it2,'Image prête')});
      });
    },function(){render()});
  }
  else if(a==='addscene'){
    P.scenes.push({
      id:rid(),title:'Nouvelle scène',summary:'',decor:'',mood:'',
      chars:[],extras:[],dialogue:'',img:null,palette:null,busy:false,shots:[]
    });
    render(true);
  }

  /* Plans */
  else if(a==='plgo')runShots();
  else if(a==='prefill-shot-global'){
    if(!P.scenes.length)return toast('Pas encore de scène');
    var last=P.scenes[P.scenes.length-1];
    var sel3=$('#shot-prefill-type');
    if(!sel3)return;
    var type3=PREFILL_SHOT_TYPES[+sel3.value];
    task(page,'Ajout d\'un plan',function(){
      var it=fd('L\'IA imagine un plan : '+type3+'…');
      return aiAddOneShot(last,type3).then(function(){
        chk();
        fdDone(it,'Plan ajouté');
      }).then(function(){
        var h=last.shots[last.shots.length-1];
        var it2=fd('Génération de l\'image du plan…');
        return gen(h.id).then(function(){fdDone(it2,'Image prête')});
      });
    },function(){render()});
  }
  else if(a==='prefill-shot'){
    var fS=find(id);
    if(!fS)return;
    var s2=fS.o;
    var sel4=$('#shot-prefill-'+id);
    if(!sel4)return;
    var type4=PREFILL_SHOT_TYPES[+sel4.value];
    task(page,'Ajout d\'un plan',function(){
      var it=fd('L\'IA imagine un plan : '+type4+'…');
      return aiAddOneShot(s2,type4).then(function(){
        chk();
        fdDone(it,'Plan ajouté');
      }).then(function(){
        var h=s2.shots[s2.shots.length-1];
        var it2=fd('Génération de l\'image…');
        return gen(h.id).then(function(){fdDone(it2,'Image prête')});
      });
    },function(){render()});
  }
  else if(a==='addshot'){
    var f1=find(id);
    if(f1&&f1.t==='s'){
      var s3=f1.o;
      s3.shots=s3.shots||[];
      s3.shots.push({
        id:rid(),size:'medium',camera:'static',action:'',end_state:'',
        chars:[],who:'',line:'',duration:5,img:null,busy:false,vst:'wait',
        palette:s3.palette||null
      });
      render(true);
    }
  }

  /* Audit */
  else if(a==='auditgo')runAudit();
  else if(a==='reaudit'){
    if(!confirm('Refaire l\'audit ? Les remarques actuelles seront remplacées.'))return;
    P.audit=null;
    P.sub.audit='cfg';
    render();
    runAudit();
  }
  else if(a==='applyissue')applyIssue(id);
  else if(a==='ignoreissue')ignoreIssue(id);
  else if(a==='applyall'){
    if(!confirm('Appliquer toutes les corrections proposées automatiquement ?'))return;
    applyAllIssues();
  }

  /* Actions sur éléments */
  else if(a==='redo')redo(+b.dataset.n);
  else if(a==='gen'){
    var i1=document.querySelector('[data-mod="'+id+'"]');
    gen(id,{extra:i1&&i1.value.trim()});
  }
  else if(a==='mod'){
    var i2=document.querySelector('[data-mod="'+id+'"]');
    if(i2&&i2.value.trim()){
      gen(id,{edit:true,extra:i2.value.trim()});
    } else {
      toast('Écrivez d\'abord ce que vous voulez changer');
      if(i2)i2.focus();
    }
  }
  else if(a==='del'){
    var f2=find(id);
    if(!f2)return;
    if(f2.t==='c')removeChar(id);
    else if(f2.t==='s'){
      if(!confirm('Supprimer cette scène ?'))return;
      P.scenes=P.scenes.filter(function(s){return s.id!==id});
      render(true);
    }
    else{
      if(!confirm('Supprimer ce plan ?'))return;
      f2.s.shots=f2.s.shots.filter(function(h){return h.id!==id});
      render(true);
    }
  }

  /* Vidéos */
  else if(a==='stoptask'){TASK.stop=true;toast('Arrêt en cours…')}
  else if(a==='retrytask')retryTask();
  else if(a==='canceltask'){TASK=null;render()}
  else if(a==='qstart')qstart();
  else if(a==='qpause'){Q.on=false;Q.st='paused';save();qui()}
  else if(a==='qnow'){Q.on=true;Q.next=0;log('in','test manuel');save()}
  else if(a==='retry'){
    var f3=find(id);
    if(f3){
      f3.o.vst='wait';
      f3.o.err='';
      Q.on=true;
      if(Q.st==='paused'||Q.st==='idle')Q.st='run';
      refresh(id);
      qui();
    }
  }

  /* Lecteur */
  else if(a==='playvid')openPlayer('video');
  else if(a==='playdiapo')openPlayer('diaporama');
  else if(a==='playaudio')playAudioOnly();
  else if(a==='stopplay')closePlayer();
  else if(a==='plnext')playerNext();
  else if(a==='plprev')playerPrev();
  else if(a==='pltoggle')playerToggle();
  else if(a==='plmode')playerChangeMode();

  /* Sessions */
  else if(a==='export'){
    var blob=new Blob([JSON.stringify(P,null,2)],{type:'application/json'});
    var u=URL.createObjectURL(blob);
    var l=document.createElement('a');
    l.href=u;
    l.download=(P.title||'film')+'.json';
    l.click();
  }
  else if(a==='sess')sessions();
  else if(a==='new'){
    setP(newP());
    $('#md').classList.remove('on');
    page=KEYS.list.length?1:0;
    render();
  }
  else if(a==='open'){
    dbGet('sessions',id).then(function(p){
      if(!p)return;
      setP(p);
      page=KEYS.list.length?Math.max(1,Math.min(p.page||1,7)):0;
      $('#md').classList.remove('on');
      render();
      resume();
    });
  }
  else if(a==='delsess'){
    if(!confirm('Supprimer cette session ?'))return;
    dbDel('sessions',id).then(function(){
      if(P.id===id){
        setP(newP());
        page=KEYS.list.length?1:0;
        render();
      }
      sessions();
    });
  }
  } 

/* ═══ ÉCOUTEURS GLOBAUX ═══ */
document.addEventListener('click',function(e){
  onClick(e).catch(function(er){
    log('er','action : '+((er&&er.message)||er));
    toast('Erreur : '+((er&&er.message)||er));
  });
});
window.addEventListener('error',function(e){
  log('er',e.message||'?');
});
window.addEventListener('unhandledrejection',function(e){
  log('er','promesse : '+((e.reason&&e.reason.message)||e.reason));
});

/* Saisie texte (tous les champs data-f + synraw) */
document.addEventListener('input',function(e){
  var t=e.target;
  if(!P)return;
  if(t.id==='synraw'){
    P.synRaw=t.value;
    if(PAGE_ORDER[page]==='brief'){
      var nx=$('#nx');
      if(nx)nx.disabled=!(P.genre&&P.synRaw.trim().length>15);
    }
    save();
    return;
  }
  if(!t.dataset||!t.dataset.f)return;
  var o=(t.dataset.id==='P')?P:((find(t.dataset.id)||{}).o);
  if(!o)return;
  if(t.dataset.arr){
    o[t.dataset.f]=t.value.split(',').map(function(s){return s.trim()}).filter(Boolean);
  } else {
    o[t.dataset.f]=t.value;
  }
  if(!o._edited)o._edited={};
  o._edited[t.dataset.f]=now();
  save();
});

/* Changements (checkbox suggestions, checkbox personnages, upload) */
document.addEventListener('change',function(e){
  var t=e.target;

  if(t.dataset.sg!==undefined){
    if(!P.syn)return;
    var i=+t.dataset.sg;
    P.syn.sel=P.syn.sel||[];
    if(t.checked){if(P.syn.sel.indexOf(i)<0)P.syn.sel.push(i)}
    else P.syn.sel=P.syn.sel.filter(function(x){return x!==i});
    save();
    return;
  }

  if(t.dataset.chars){
    var oid=t.dataset.chars;
    var cid=t.dataset.cid;
    var f=find(oid);
    if(!f)return;
    if(!f.o.chars)f.o.chars=[];
    if(t.checked){if(f.o.chars.indexOf(cid)<0)f.o.chars.push(cid)}
    else f.o.chars=f.o.chars.filter(function(x){return x!==cid});
    if(!f.o._edited)f.o._edited={};
    f.o._edited.chars=now();
    save();
    render(true);
    return;
  }

  if(t.dataset.up){
    var file=t.files[0];
    if(!file)return;
    var ff=find(t.dataset.up);
    if(!ff)return;
    readFile(file,1024).then(function(im){
      if(!im){toast('Image illisible');return}
      ff.o.img=im;
      ff.o.err='';
      if(ff.t==='c'){
        ff.o.busy=true;
        refresh(ff.o.id);
        return aiDescribe(ff.o).catch(function(er){
          log('wr','analyse photo : '+er.message);
        }).then(function(){
          ff.o.busy=false;
          refresh(ff.o.id);
          save();
        });
      }
      refresh(ff.o.id);
      save();
    });
  }
});

/* Ping vidéo vue */
document.addEventListener('play',function(e){
  var v=e.target;
  if(v.dataset&&v.dataset.id){
    var f=find(v.dataset.id);
    if(f&&!f.o.seen){
      f.o.seen=true;
      var n=v.parentNode.querySelector('.nw');
      if(n)n.remove();
      save();
      stats();
    }
  }
},true);

/* Clavier player */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&PLAYER.active){closePlayer();return}
  if(!PLAYER.active)return;
  if(e.key==='ArrowRight')playerNext();
  else if(e.key==='ArrowLeft')playerPrev();
  else if(e.key===' '){e.preventDefault();playerToggle()}
});

/* ═══ SESSIONS ═══ */
function sessions(){
  dbAll('sessions').then(function(list){
    list.sort(function(a,b){return b.upd-a.upd});
    var html='<h3>Mes films</h3>'+
      '<p class="sub">Tout est enregistré automatiquement dans ce navigateur.</p>'+
      '<div class="rw">'+btn('new','+ Nouveau film','big')+btn('closemd','Fermer')+'</div>'+
      list.map(function(p){
        var sh=[];
        (p.scenes||[]).forEach(function(s){
          (s.shots||[]).forEach(function(h){sh.push(h)});
        });
        var nv=sh.filter(function(h){return h.video&&!h.seen}).length;
        return '<div class="cd" style="margin-top:8px">'+
          '<b>'+esc(p.title||(p.genre&&p.genre.name)||'Sans titre')+'</b>'+
          (p.id===P.id?' · <span class="lab">en cours</span>':'')+
          '<div class="lab">'+fmtDate(p.upd)+' · '+(p.scenes||[]).length+' scènes · '+
          sh.filter(function(h){return h.img}).length+' images · '+
          sh.filter(function(h){return h.video}).length+' vidéos'+
          (nv?' · '+nv+' non vues':'')+'</div>'+
          '<div class="rw">'+
            btn('open','Ouvrir','sm','data-id="'+p.id+'"')+
            btn('delsess','Supprimer','sm danger','data-id="'+p.id+'"')+
          '</div>'+
        '</div>';
      }).join('');
    $('#mdc').innerHTML=html;
    $('#md').classList.add('on');
  });
}
$('#md').addEventListener('click',function(e){
  if(e.target.id==='md')e.target.classList.remove('on');
});

/* ═══ REPRISE + INITIALISATION ═══ */
function resume(){
  shots().forEach(function(x){
    if(x.h.vst==='run'&&x.h.task){
      var found=false;
      for(var i=0;i<KEYS.list.length;i++)if(KEYS.list[i].k===x.h.task.k){found=true;break}
      if(found)poll(x.h);
      else x.h.vst='wait';
    }
  });
  qui();
}
function boot(){
  /* Rendu immédiat */
  try{
    if(!P)P=newP();
    render();
  }catch(e){
    log('er','boot initial : '+e.message);
  }

  /* Chargement asynchrone des préférences */
  openDB().then(function(handle){
    db=handle;
  }).catch(function(e){
    db=null;
    dbFallback(e);
  }).then(function(){
    return dbGet('config','keys');
  }).then(function(k){
    if(k&&k.list&&k.list.length){
      KEYS.plan=k.plan||'free';
      KEYS.list=k.list.map(mkKey);
    }
    return dbGet('config','last');
  }).then(function(last){
    if(last&&last.v)return dbGet('sessions',last.v);
    return null;
  }).then(function(sess){
    setP(sess||newP());

    /* Détermine la page de départ */
    if(!KEYS.list.length)page=0;
    else if(!P.genre||!P.synRaw||P.synRaw.trim().length<15)page=1;
    else if(!P.final)page=2;
    else if(P.sub.chars!=='rev')page=3;
    else if(P.sub.scenes!=='rev')page=4;
    else if(P.sub.shots!=='rev')page=5;
    else if(P.sub.audit!=='rev')page=6;
    else page=7;

    if(page<0)page=0;
    if(page>=STEPS.length)page=STEPS.length-1;

    render();
    resume();

    log('in','CINÉ-GENESIS prêt · '+KEYS.list.length+' clé(s)');

    /* Si on revient sur une étape où une tâche attendait, on relance */
    if(KEYS.list.length)onEnter();
  }).catch(function(e){
    log('er','init : '+e.message);
    try{
      setP(newP());
      page=0;
      render();
    }catch(e2){
      log('er','fallback init : '+e2.message);
    }
  });
}

/* Lancer */
boot();
